[platformio]
default_envs = native

[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -I src -D_USE_MATH_DEFINES
build_src_filter = +<foc_math.cpp>
test_build_src = yes

[env:rp2350]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = generic_rp2350
board_build.core = earlephilhower
framework = arduino
build_flags = -std=gnu++17 -I src
